[project]
name = "ghostwriter-agent"
version = "0.1.0"
description = "LangGraph agent that replies to Telegram messages on behalf of its owner."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "langchain>=1.4.3",
    "langchain-core>=1.6.8",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.14",
    "openai>=3.49.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "fastapi-cli>=0.0.33",
    "httpx>=0.28.1",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.fastapi]
entrypoint = "ghostwriter_agent.api.main:app"
